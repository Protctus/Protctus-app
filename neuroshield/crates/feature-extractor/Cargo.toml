[package]
name = "feature-extractor"
description = "53-feature lexical feature extractor for phishing detection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "feature_extractor"
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = "symbols"
panic = "abort"
