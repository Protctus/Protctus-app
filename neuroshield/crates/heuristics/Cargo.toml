[package]
name = "heuristics"
description = "Lightweight heuristic phishing detection layer (L1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "heuristics"
crate-type = ["cdylib", "rlib"]

[dependencies]
feature-extractor = { path = "../feature-extractor" }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = "symbols"
panic = "abort"
